<mat-card class="task-item">
    <mat-card-header>
        <mat-card-title>{{ task.title }}</mat-card-title>
    </mat-card-header>

    <mat-card-content>

    </mat-card-content>
        @if (task.description) {
        <p><strong>{{ task.description }}</strong></p>
        }
        <p><strong>Виконавець: {{ task.assignee }}</strong></p>
        <p><strong>Дата виконання:</strong> {{ task.dueDate | date:'dd.MM.yyyy' }} </p>
        <p><strong>Статус: </strong> 
            <span [ngClass]="getStatusClasses()"> {{ task.status | taskStatus }} </span>
        </p>

    <mat-form-field>
        <mat-label>Статус</mat-label>
        <mat-select (selectionChange)="updateStatus($event)">
            <mat-option [value]="TaskStatus.TODO">До роботи</mat-option>
            <mat-option [value]="TaskStatus.IN_PROGRESS">У процесі</mat-option>
            <mat-option [value]="TaskStatus.DONE">Виконано</mat-option>
        </mat-select>
    </mat-form-field>

    <mat-card-actions>
        <button mat-fab class="edit-button" (click)="editTask()"><mat-icon>edit</mat-icon></button>
        <button mat-fab class="delete-button" (click)="deleteTask(task.id)"><mat-icon>delete</mat-icon></button>
    </mat-card-actions>
</mat-card>
